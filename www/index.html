<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>نظام الكاشير</title><style>
:root{--bg:#e0e5ec;--l:#fff;--d:#a3b1c6;--n:#1a2a4f;--t:#1a2a4f;--r:#c0392b}
body.dk{--bg:#2b2f3a;--l:#363b49;--d:#1d2028;--t:#e8ecf5}
*{box-sizing:border-box;font-family:Tahoma,Arial,sans-serif}
body{margin:0;background:var(--bg);color:var(--t);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
nav{display:flex;gap:6px;padding:10px 8px;position:sticky;top:0;background:var(--bg);z-index:5;overflow-x:auto}
.tab{flex:1;min-width:52px;border:0;background:var(--bg);border-radius:14px;padding:6px 2px;font-size:10px;color:var(--t);box-shadow:4px 4px 8px var(--d),-4px -4px 8px var(--l)}
.tab i{display:flex;margin:0 auto 3px;width:34px;height:34px;border-radius:50%;background:var(--n);align-items:center;justify-content:center}
.tab svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{box-shadow:inset 3px 3px 6px var(--d),inset -3px -3px 6px var(--l)}
main{padding:4px 10px 30px;max-width:720px;margin:auto}
.card{background:var(--bg);border-radius:16px;padding:12px;margin:10px 0;box-shadow:6px 6px 12px var(--d),-6px -6px 12px var(--l)}
input,select,textarea{width:100%;margin:4px 0;padding:10px;border:0;border-radius:12px;background:var(--bg);color:var(--t);font-size:14px;box-shadow:inset 3px 3px 6px var(--d),inset -3px -3px 6px var(--l)}
.b{border:0;border-radius:12px;padding:10px 14px;margin:4px 2px;background:var(--n);color:#fff;font-size:13px;box-shadow:3px 3px 6px var(--d),-3px -3px 6px var(--l)}
.b.s{padding:5px 9px;font-size:11px}.b.w{background:var(--bg);color:var(--n);box-shadow:3px 3px 6px var(--d),-3px -3px 6px var(--l)}
body.dk .b.w{color:#fff}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.row>*{flex:1}
.ac{display:flex;justify-content:space-around}.ac .b{display:flex;flex-direction:column;align-items:center;gap:2px;flex:1}
.ac svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:1.8}
table{width:100%;border-collapse:collapse;font-size:12px}td,th{padding:5px;border-bottom:1px solid var(--d);text-align:right}
.red{color:var(--r);font-weight:700}.rd{display:inline-block;background:var(--r);color:#fff;border-radius:10px;padding:2px 8px;font-size:11px;margin:2px}
.ov{position:fixed;inset:0;background:#0008;z-index:9;overflow:auto;padding:14px}.mo{max-width:560px;margin:auto}
.inv{background:#fff;color:#000;padding:12px;border-radius:8px;text-align:center}.inv td,.inv th{border-color:#ccc}
.bn{background:#fff3cd;color:#664d03;padding:8px;border-radius:10px;margin:8px 0;font-size:13px}
@media print{body>*:not(#md){display:none!important}.ov{position:static;background:none;padding:0}.np{display:none!important}.mo{box-shadow:none;background:#fff;max-width:none;width:var(--pw,80mm);margin:0;padding:0}}
</style></head><body><div id="lk"></div><nav id="nv"></nav><main id="pg"></main><div id="md"></div><script>
const $=i=>document.getElementById(i),ls=localStorage;let S;try{S=JSON.parse(ls.pos)}catch(e){}
S=S||{p:[],c:[],i:[],h:[],r:[],n:1,log:[],s:{shop:'محلي',ph:'',ad:'',pw:'',dk:0,pm:'inv',ft:'شكراً لتعاملكم معنا',w:'80mm'}}
const save=()=>ls.pos=JSON.stringify(S),f=n=>(+n||0).toFixed(2),td=(o=0)=>new Date(Date.now()-o*864e5).toISOString().slice(0,10)
let tab=0,cur={it:[],c:null,pay:'cash',due:''}
const L=['الكاشير','المخزن','الحسابات','التقارير','استعادة','الإعدادات'],
IC=['<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 12h2M12 12h2M8 16h2M12 16h2"/>','<path d="M3 7l9-4 9 4v10l-9 4-9-4zM3 7l9 4 9-4M12 11v10"/>','<circle cx="9" cy="8" r="3"/><path d="M3 20c0-4 3-6 6-6s6 2 6 6M16 5a3 3 0 010 6M18 14c2 1 3 3 3 6"/>','<path d="M4 20V4M4 20h16M8 16v-4M12 16V8M16 16v-6"/>','<path d="M4 12a8 8 0 108-8M4 4v5h5M12 8v4l3 2"/>','<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>'],
sv=p=>`<svg viewBox="0 0 24 24">${p}</svg>`
const M=h=>$('md').innerHTML=h?`<div class="ov"><div class="mo card">${h}<button class="b np" onclick="M()">إغلاق</button></div></div>`:''
function go(t){if(t!=null)tab=t;document.body.className=S.s.dk?'dk':'';document.body.style.setProperty('--pw',S.s.w);
$('nv').innerHTML=L.map((l,i)=>`<button class="tab ${i==tab?'on':''}" onclick="go(${i})"><i>${sv(IC[i])}</i>${l}</button>`).join('');
$('pg').innerHTML=[cash,inv,acc,rep,rest,set][tab]()+rem();save()}
function rem(){if(tab)return'';let o='';const t=td(),y=td(-1);S.i.filter(v=>v.t=='sale'&&v.pay=='credit'&&v.due&&S.c[v.c]&&S.c[v.c].debt>0).forEach(v=>{if(v.due==t||v.due==y)o+=`<div class="bn">🔔 ${v.due==t?'اليوم':'غداً'} موعد سداد ${S.c[v.c].n} - فاتورة #${v.n}</div>`});return o}
const tot=it=>it.reduce((a,x)=>a+x.q*x.pr,0),pf=it=>it.reduce((a,x)=>a+x.q*(x.pr-x.cost),0)
/* ---------- الكاشير ---------- */
function cash(){const pr=S.p.map(p=>`<option value="${p.id}">${p.n}</option>`).join('');
return`<div class="card"><b>الزبون</b> ${cur.c!=null?`: ${S.c[cur.c].n} <button class="b s w" onclick="cur.c=null;go()">تغيير</button>`:`<input id="cs" placeholder="ابحث بالاسم أو الرقم" oninput="cse()"><div id="cr"></div><button class="b s" onclick="addC(1)">+ زبون جديد</button>`}
<select onchange="cur.pay=this.value;go()"><option value="cash">نقدي</option><option value="credit" ${cur.pay=='credit'?'selected':''}>آجل</option></select>
${cur.pay=='credit'?`معاد الدفع<input type="date" value="${cur.due}" onchange="cur.due=this.value">`:''}</div>
<div class="card"><select id="ps" onchange="pick()"><option value="">صنف يدوي</option>${pr}</select><input id="pn" placeholder="اسم الصنف"><div class="row"><input id="pq" type="number" value="1" placeholder="الكمية"><input id="pp" type="number" placeholder="السعر"></div>
<select onchange="S.s.pm=this.value;save()"><option value="inv">السعر من المخزن</option><option value="man" ${S.s.pm=='man'?'selected':''}>السعر يدوي كل مرة</option></select><button class="b" onclick="add()">إضافة للفاتورة</button></div>
<div class="card"><table>${cur.it.map((x,i)=>`<tr><td>${x.n}</td><td>${x.q}×${f(x.pr)}</td><td>${f(x.q*x.pr)}</td><td><button class="b s w" onclick="cur.it.splice(${i},1);go()">✕</button></td></tr>`).join('')}</table><h3>الإجمالي: ${f(tot(cur.it))}</h3></div>
<div class="card ac"><button class="b" onclick="mk()">${sv('<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/>')}إنشاء فاتورة</button><button class="b" onclick="hold()">${sv('<rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/>')}تعليق</button><button class="b" onclick="held()">${sv('<path d="M4 6h16M4 12h16M4 18h16"/>')}المعلقة (${S.h.length})</button></div>
<div class="card ac"><button class="b w" onclick="ret()">↩ فاتورة مرتجع</button><button class="b w" onclick="scan()">▮▯▮ قراءة باركود</button></div>`}
function cse(){const v=$('cs').value;$('cr').innerHTML=v?S.c.map((c,i)=>(c.n+c.ph).includes(v)?`<button class="b w s" onclick="cur.c=${i};go()">${c.n} ${c.ph}</button>`:'').join(''):''}
function addC(k){const n=prompt('اسم الزبون');if(!n)return;S.c.push({n,ph:prompt('الرقم')||'',debt:0,pays:[],nt:[]});if(k)cur.c=S.c.length-1;go()}
function pick(){const p=S.p.find(x=>x.id==$('ps').value);$('pn').value=p?p.n:'';$('pp').value=p&&S.s.pm=='inv'?p.sp||'':''}
function add(){const p=S.p.find(x=>x.id==$('ps').value),n=$('pn').value,pr=+$('pp').value;if(!n||!pr)return alert('اكتب الاسم والسعر');cur.it.push({n,q:+$('pq').value||1,pr,cost:p?p.cp||0:0,id:p?p.id:0});go()}
function mk(){if(!cur.it.length)return alert('الفاتورة فاضية');if(cur.pay=='credit'&&cur.c==null)return alert('اختر زبون للبيع الآجل');if(cur.pay=='credit'&&!cur.due)return alert('حدد معاد الدفع');
const v={n:S.n++,t:'sale',d:td(),tm:new Date().toLocaleTimeString('ar-EG'),c:cur.c,pay:cur.pay,due:cur.due,it:cur.it};
v.it.forEach(x=>{const p=S.p.find(y=>y.id==x.id);if(p)p.q-=x.q});if(v.pay=='credit')S.c[v.c].debt+=tot(v.it);
S.i.push(v);cur={it:[],c:null,pay:'cash',due:''};go();view(v.n)}
function hold(){if(!cur.it.length)return;S.h.push(cur);cur={it:[],c:null,pay:'cash',due:''};go()}
function held(){M(S.h.map((h,i)=>`<div class="row"><span>${h.c!=null?S.c[h.c].n:'بدون زبون'} - ${f(tot(h.it))}</span><button class="b s" onclick="cur=S.h.splice(${i},1)[0];M();go()">فتح</button><button class="b s w" onclick="S.h.splice(${i},1);held();go()">حذف</button></div>`).join('')||'لا توجد فواتير معلقة')}
function ret(n){n=n||prompt('رقم الفاتورة الأصلية');const o=S.i.find(x=>x.n==n&&x.t=='sale');if(!o)return alert('فاتورة غير موجودة');
const it=[];o.it.forEach(x=>{const q=+prompt(`${x.n}: كمية المرتجع (الأصل ${x.q})`,0)||0;if(q>0)it.push({...x,q:Math.min(q,x.q)})});if(!it.length)return;
const v={n:S.n++,t:'ret',ref:o.n,d:td(),tm:new Date().toLocaleTimeString('ar-EG'),c:o.c,pay:o.pay,it};
it.forEach(x=>{const p=S.p.find(y=>y.id==x.id);if(p)p.q+=x.q});if(o.pay=='credit')S.c[o.c].debt-=tot(it);S.i.push(v);go();view(v.n)}
/* ---------- الفاتورة والباركود ---------- */
const T={0:'nnnwwnwnn',1:'wnnwnnnnw',2:'nnwwnnnnw',3:'wnwwnnnnn',4:'nnnwwnnnw',5:'wnnwwnnnn',6:'nnwwwnnnn',7:'nnnwnnwnw',8:'wnnwnnwnn',9:'nnwwnnwnn','*':'nwnnwnwnn'}
function bc(n){let x=0,r='';for(const ch of '*'+String(n).padStart(6,'0')+'*'){for(let k=0;k<9;k++){const w=T[ch][k]=='w'?3:1;if(k%2==0)r+=`<rect x="${x}" width="${w}" height="40"/>`;x+=w}x+=1}return`<svg viewBox="0 0 ${x} 40" style="width:100%;max-width:240px;height:54px" fill="#000">${r}</svg>`}
function view(n){const v=S.i.find(x=>x.n==n);if(!v)return alert('غير موجودة');const s=S.s,c=v.c!=null?S.c[v.c]:null,tb=it=>`<table><tr><th>الصنف</th><th>الكمية</th><th>السعر</th><th>الإجمالي</th></tr>${it.map(x=>`<tr><td>${x.n}</td><td>${x.q}</td><td>${f(x.pr)}</td><td>${f(x.q*x.pr)}</td></tr>`).join('')}</table>`;
const o=v.ref&&S.i.find(x=>x.n==v.ref),ti={sale:'فاتورة بيع',ret:'فاتورة مرتجع',res:'إيصال حجز'}[v.t];
let h=`<div class="inv"><h3>${s.shop}</h3><small>${s.ph} ${s.ad}</small><h4>${ti} #${v.n}</h4><small>${v.d} ${v.tm||''}${c?' | '+c.n:''} | ${v.pay=='credit'?'آجل - سداد '+v.due:v.pay=='cash'?'نقدي':''}</small>`;
if(o){const rt=S.i.filter(x=>x.ref==o.n&&x.n<=v.n).reduce((a,x)=>a+tot(x.it),0);h+=`<p><b>الفاتورة الأصلية #${o.n}</b> (${f(tot(o.it))})</p>${tb(o.it)}<p><b>المرتجع</b></p>${tb(v.it)}<h3>الصافي بعد الترجيع: ${f(tot(o.it)-rt)}</h3>`}
else{h+=tb(v.it)+`<h3>الإجمالي: ${f(tot(v.it))}</h3>`;if(v.t=='res')h+=`<p>ينتهي الحجز: ${v.end} <br>${v.det||''}</p>`}
h+=`${bc(v.n)}<br><small>${s.ft}</small></div><div class="row np"><button class="b" onclick="print()">🖨 طباعة</button><button class="b" onclick="shr(${v.n})">مشاركة PDF</button></div>`;M(h)}
function shr(n){const v=S.i.find(x=>x.n==n),t=`${S.s.shop} - فاتورة #${n}\n`+v.it.map(x=>`${x.n} ${x.q}×${f(x.pr)}`).join('\n')+`\nالإجمالي ${f(tot(v.it))}`;if(navigator.share)navigator.share({title:'فاتورة',text:t}).catch(()=>{});else print()}
async function scan(){M(`<input id="sc" type="number" placeholder="رقم الفاتورة"><button class="b" onclick="view($('sc').value)">عرض</button><video id="vd" style="width:100%;border-radius:12px" autoplay playsinline></video>`);
if(!('BarcodeDetector'in window))return;try{const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}),vd=$('vd');vd.srcObject=st;const d=new BarcodeDetector({formats:['code_39']});
const lp=async()=>{if(!$('vd'))return st.getTracks().forEach(t=>t.stop());try{const r=await d.detect(vd);if(r.length){st.getTracks().forEach(t=>t.stop());return view(+r[0].rawValue.replace(/\*/g,''))}}catch(e){}setTimeout(lp,300)};lp()}catch(e){}}
/* ---------- المخزن ---------- */
const rs=id=>S.r.filter(r=>r.p==id&&!r.x)
function inv(){return`<div class="card"><input id="in" placeholder="اسم الصنف"><input id="iq" type="number" placeholder="الكمية"><input id="ic" type="password" placeholder="سعر الشراء بالجملة (سري)"><input id="is" type="number" placeholder="سعر البيع (اختياري)"><button class="b" onclick="addP()">إضافة صنف</button><button class="b w" onclick="resv()">عرض الحجوزات</button></div>
${S.p.map(p=>{const r=rs(p.id),rq=r.reduce((a,x)=>a+x.q,0),av=p.q-rq;return`<div class="card"><b>${p.n}</b> <span class="${p.q<0?'red':''}">الكمية: ${p.q}</span><br>بيع: ${p.sp?f(p.sp):'-'} <span onclick="this.textContent='شراء: ${f(p.cp)}'">| شراء 👁</span> ${p.sp&&p.cp?`| ربح الوحدة ${f(p.sp-p.cp)}`:''}
${r.length?`<br><span class="rd" onclick="shR(${p.id})">🔴 محجوز ${rq} ❗ المتاح ${av}</span>`:''}<br><button class="b s w" onclick="edP(${p.id})">تعديل</button><button class="b s w" onclick="S.p=S.p.filter(x=>x.id!=${p.id});go()">حذف</button></div>`}).join('')}`}
function addP(){const n=$('in').value;if(!n)return;S.p.push({id:Date.now(),n,q:+$('iq').value||0,cp:+$('ic').value||0,sp:+$('is').value||0});go()}
function edP(id){const p=S.p.find(x=>x.id==id);p.q=+prompt('الكمية',p.q);p.cp=+prompt('سعر الشراء',p.cp);p.sp=+prompt('سعر البيع',p.sp);go()}
function shR(id){M(rs(id).map(r=>`<p>${S.c[r.c].n}: ${r.q} حتى ${r.end}<br>${r.det}</p>`).join(''))}
function resv(){M(S.r.filter(r=>!r.x).map(r=>`<div class="card">${S.p.find(p=>p.id==r.p).n} × ${r.q}<br>${S.c[r.c].n} - ينتهي ${r.end}<br><button class="b s" onclick="view(${r.n})">الإيصال</button><button class="b s w" onclick="S.r.find(x=>x.n==${r.n}).x=1;resv();go()">إلغاء الحجز</button></div>`).join('')||'لا توجد حجوزات')}
/* ---------- الحسابات ---------- */
function acc(){return`<div class="card"><input id="as" placeholder="بحث بالاسم أو الرقم" oninput="go()" value="${$('as')?$('as').value:''}"><button class="b" onclick="addC(0)">+ إضافة عميل</button></div>`+S.c.map((c,i)=>(c.n+c.ph).includes($('as')?$('as').value:'')?`<div class="card"><b>${c.n}</b> ${c.ph}<br>الدين عليه: <span class="${c.debt>0?'red':''}">${f(c.debt)}</span>
<div class="row"><input id="py${i}" type="number" placeholder="مبلغ سداد"><button class="b s" onclick="pay(${i})">سداد</button></div>
<button class="b s w" onclick="stm(${i})">كشف حساب</button><button class="b s w" onclick="res(${i})">حجز بضاعة فوري</button><button class="b s w" onclick="nt(${i})">❗ إضافة ملاحظة</button></div>`:'').join('')}
function pay(i){const v=+$('py'+i).value;if(!v)return;S.c[i].debt-=v;S.c[i].pays.push({d:td(),a:v});go()}
function nt(i){const t=prompt('الملاحظة');if(t){S.c[i].nt.push({d:td(),t});go()}}
function stm(i){const c=S.c[i],vs=S.i.filter(v=>v.c==i),ds=[...new Set(vs.map(v=>v.d))].sort().reverse();
M(`<h3>${c.n} - الدين ${f(c.debt)}</h3>`+ds.map(d=>`<details><summary>${d}</summary>${vs.filter(v=>v.d==d).map(v=>`<button class="b s w" onclick="view(${v.n})">#${v.n} ${{sale:'بيع',ret:'مرتجع',res:'حجز'}[v.t]} ${f(tot(v.it))}</button>`).join('')}</details>`).join('')+c.pays.map(p=>`<p>سداد ${p.d}: ${f(p.a)}</p>`).join('')+c.nt.map(n=>`<p>❗ ${n.d}: ${n.t}</p>`).join(''))}
function res(i){M(`<h3>حجز بضاعة - ${S.c[i].n}</h3><select id="rp">${S.p.map(p=>`<option value="${p.id}">${p.n} (متاح ${p.q-rs(p.id).reduce((a,x)=>a+x.q,0)})</option>`).join('')}</select><input id="rq" type="number" value="1"><label>انتهاء الحجز<input id="re" type="date"></label><textarea id="rd" placeholder="تفاصيل الحجز"></textarea><button class="b" onclick="cres(${i})">تأكيد الحجز</button>`)}
function cres(i){const p=S.p.find(x=>x.id==$('rp').value),q=+$('rq').value,end=$('re').value;if(!p||!q||!end)return alert('أكمل البيانات');
if(p.q-rs(p.id).reduce((a,x)=>a+x.q,0)<q&&!confirm('البضاعة لا تكفي، سيتم العد بالسالب. متابعة؟'))return;
const v={n:S.n++,t:'res',d:td(),tm:new Date().toLocaleTimeString('ar-EG'),c:i,end,det:$('rd').value,it:[{n:p.n,q,pr:p.sp,cost:p.cp,id:p.id}]};S.i.push(v);S.r.push({n:v.n,p:p.id,q,end,c:i,det:v.det});go();view(v.n)}
/* ---------- التقارير ---------- */
function rep(){const t=td(),vs=S.i.filter(v=>v.d==t),sl=vs.filter(v=>v.t=='sale'),rt=vs.filter(v=>v.t=='ret'),cs=sl.filter(v=>v.pay=='cash'),cr=sl.filter(v=>v.pay=='credit'),pl=n=>S.i.filter(v=>v.d>=td(n)&&v.t!='res').reduce((a,v)=>a+(v.t=='ret'?-1:1)*pf(v.it),0),col=S.c.reduce((a,c)=>a+c.pays.filter(p=>p.d==t).reduce((b,p)=>b+p.a,0),0);
return`<div class="card"><h3>كشف حساب اليوم ${t}</h3>مبيعات نقدي: ${f(cs.reduce((a,v)=>a+tot(v.it),0))}<br>مبيعات آجل: ${f(cr.reduce((a,v)=>a+tot(v.it),0))}<br>مرتجعات: ${f(rt.reduce((a,v)=>a+tot(v.it),0))}<br>تحصيل ديون: ${f(col)}<br>حجوزات: ${vs.filter(v=>v.t=='res').length}<br>إجمالي الديون على العملاء: ${f(S.c.reduce((a,c)=>a+c.debt,0))}</div>
<div class="card"><h3>الأرباح</h3>اليوم: ${f(pl(0))}<br>الأسبوع: ${f(pl(6))}<br>الشهر: ${f(pl(29))}<br><small>الربح = (سعر البيع − سعر الشراء وقت البيع) × الكمية، ويُخصم منه المرتجع.</small></div>
<div class="card">${vs.map(v=>`<button class="b s w" onclick="view(${v.n})">#${v.n} ${{sale:'بيع',ret:'مرتجع',res:'حجز'}[v.t]} ${f(tot(v.it))}</button>`).join('')||'لا توجد حركات اليوم'}</div>`}
/* ---------- استعادة ---------- */
function rest(){return`<div class="card"><h3>استعادة البيانات</h3><input type="file" accept=".json" onchange="rst(this.files[0])"></div>`}
function rst(fl){if(!fl)return;if(!confirm('سيتم تبديل كل شيء بالبرنامج بالبيانات الموجودة في الملف. متابعة؟'))return;const r=new FileReader();r.onload=()=>{try{S=JSON.parse(r.result);if(!S.p)throw 0;save();go(0);alert('تمت الاستعادة')}catch(e){alert('ملف غير صالح')}};r.readAsText(fl)}
/* ---------- الإعدادات ---------- */
function set(){const s=S.s,I=(k,p,t='text')=>`<input type="${t}" placeholder="${p}" value="${s[k]||''}" onchange="S.s['${k}']=this.value;save()">`;
return`<div class="card"><h3>بيانات المحل</h3>${I('shop','اسم المحل')}${I('ph','هاتف')}${I('ad','العنوان')}</div>
<div class="card"><h3>كلمة السر</h3>${I('pw','كلمة سر (فارغة = بدون)','password')}</div>
<div class="card"><h3>المظهر</h3><select onchange="S.s.dk=+this.value;go()"><option value="0">فاتح</option><option value="1" ${s.dk?'selected':''}>غامق</option></select></div>
<div class="card"><h3>قالب الفاتورة والطابعة</h3>${I('ft','نص أسفل الفاتورة')}<select onchange="S.s.w=this.value;go()">${['58mm','80mm','210mm'].map(w=>`<option ${s.w==w?'selected':''}>${w}</option>`).join('')}</select><small>الطباعة تعمل عبر نظام الطباعة بالجهاز (طابعة حرارية متصلة بالبلوتوث/USB)</small></div>
<div class="card"><button class="b" onclick="bk()">نسخ احتياطي</button><button class="b w" onclick="cl()">إغلاق الوردية</button></div>`}
async function bk(){const b=new Blob([JSON.stringify(S)],{type:'application/json'}),nm='backup-'+td()+'.json';try{if(window.showSaveFilePicker){const h=await showSaveFilePicker({suggestedName:nm}),w=await h.createWritable();await w.write(b);await w.close();return}}catch(e){return}
const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=nm;a.click()}
function cl(){const t=td(),vs=S.i.filter(v=>v.d==t&&v.t=='sale');M(`<h3>تفاصيل اليوم</h3>عدد الفواتير: ${vs.length}<br>الإجمالي: ${f(vs.reduce((a,v)=>a+tot(v.it),0))}<br>الربح: ${f(vs.reduce((a,v)=>a+pf(v.it),0))}<br><button class="b" onclick="S.log.push(td());save();M();alert('تم إغلاق الوردية')">خلاص كده المحل قفل</button>`)}
/* ---------- القفل ---------- */
function lock(){if(!S.s.pw)return go(0);$('lk').innerHTML=`<div class="ov"><div class="mo card"><h3>كلمة السر</h3><input id="lp" type="password"><button class="b" onclick="if($('lp').value==S.s.pw){$('lk').innerHTML='';go(0)}else alert('كلمة سر خاطئة')">دخول</button></div></div>`}
lock()
</script></body></html>
